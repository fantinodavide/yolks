name: build nodejs-mongodb
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - master
    paths:
      - custom/nodejs-mongodb/**
      - .github/workflows/nodejs-mongo.yml

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: "yolks:nodejs-mongodb"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./custom/nodejs-mongodb
          file: ./custom/nodejs-mongodb/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/fantinodavide/yolks:nodejs-mongodb
